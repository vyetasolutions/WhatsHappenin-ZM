<!DOCTYPE html>
<html lang="en" class="bg-[#030303] text-gray-100 antialiased selection:bg-emerald-500/30 overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsHappenin // The Weekend, Curated</title>
    
    <!-- PREMIUM WHATSAPP OPEN GRAPH LINK EMBED -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="WhatsHappenin // The Weekend, Curated">
    <meta property="og:description" content="Discover the best events, nightlife, and chilled vibes across Zambia this weekend. Powered by Vyeta.">
    <meta property="og:url" content="https://vyetasolutions.github.io/">
    <meta property="og:image" content="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&q=80&w=1200">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] }
                }
            }
        }
    </script>
    <style>
        html, body { max-width: 100%; overflow-x: hidden; position: relative; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-sticky {
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .glass-panel {
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .premium-glow { box-shadow: 0 0 40px -10px rgba(16, 185, 129, 0.12); }
        .text-gradient {
            background: linear-gradient(135deg, #34d399 0%, #059669 100%);
            -webkit-bg-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex justify-center items-start min-h-screen bg-[#030303] pb-6">

    <!-- Ambient Grid Background Flare -->
    <div class="absolute top-[-10%] left-[-10%] w-[400px] h-[400px] bg-emerald-500/[0.03] rounded-full blur-[120px] pointer-events-none"></div>

    <main 
        x-data="{ 
            searchQuery: '',
            selectedVibe: 'All',
            activeTab: 'weekend',
            events: [],
            steppedOutEvents: [],
            apiEndpoint: 'https://script.google.com/macros/s/AKfycbziBiOAPM6HDx7QZhJDuOQpu6FG4ZjbiWaj2AA-V5efsq_sgWPK41rPVCvjVdSnHE8X2g/exec',
            
            vibeModalOpen: false,
            activeVibeTarget: {},

            init() {
                this.steppedOutEvents = JSON.parse(localStorage.getItem('whatsHap_stepping_out') || '[]');
                this.fetchData();
            },
            fetchData() {
                fetch(this.apiEndpoint)
                    .then(res => res.json())
                    .then(data => { 
                        this.events = Array.isArray(data) ? data : []; 
                    })
                    .catch(err => { console.error('Data Sync Break:', err); });
            },
            get filteredEvents() {
                return this.events.filter(e => {
                    const query = this.searchQuery.toLowerCase().trim();
                    const matchesSearch = !query || 
                        String(e.title || '').toLowerCase().includes(query) || 
                        String(e.artist || '').toLowerCase().includes(query) || 
                        String(e.venue || '').toLowerCase().includes(query) || 
                        String(e.city || '').toLowerCase().includes(query);
                    const matchesVibe = this.selectedVibe === 'All' || 
                        String(e.vibe || '').toLowerCase() === this.selectedVibe.toLowerCase();
                    return matchesSearch && matchesVibe;
                });
            },
            processStepOut(event) {
                if (this.steppedOutEvents.includes(event.id)) return;
                
                let currentCount = parseInt(event.attending_count || '0', 10);
                event.attending_count = currentCount + 1;
                this.steppedOutEvents.push(event.id);
                localStorage.setItem('whatsHap_stepping_out', JSON.stringify(this.steppedOutEvents));

                fetch(`${this.apiEndpoint}?id=${event.id}`, { method: 'POST' })
                    .then(res => res.json())
                    .then(resData => {
                        if (resData.status === 'success') {
                            event.attending_count = resData.new_count;
                        }
                    })
                    .catch(err => console.error('Sync Error on Counter Upstream:', err));
            },
            openVibeCheck(event) {
                this.activeVibeTarget = event;
                this.vibeModalOpen = true;
            },
            shareEvent(event) {
                const title = event.title || 'Event';
                const artist = event.artist || 'Various';
                const venue = event.venue || 'Venue';
                const city = event.city || 'Zambia';
                const date = event.date || 'This Weekend';
                const time = event.time || 'Late';
                
                const textMessage = '📍 *WHAT\'S HAPPENIN UPDATE* \n\n' +
                                    '🔥 *Event:* ' + title + '\n' +
                                    '🎙️ *Artist:* ' + artist + '\n' +
                                    '🏢 *Venue:* ' + venue + ' (' + city + ')\n' +
                                    '🗓️ *When:* ' + date + ' @ ' + time + '\n\n' +
                                    'Let\'s pull up together! Check the full dynamic line-up here: \n' +
                                    '👉 https://vyetasolutions.github.io/';
                                    
                const shareUrl = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(textMessage);
                window.open(shareUrl, '_blank');
            }
        }"
        class="w-full max-w-md min-h-screen bg-[#070707]/95 shadow-2xl relative border-x border-white/[0.03] flex flex-col justify-between overflow-hidden"
    >
        
        <!-- HEADER INTERFACE (No loading indicators exist) -->
        <div class="px-6 pt-7 pb-4 sticky top-0 z-40 glass-sticky">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-white">
                        WhatsHappenin<span class="text-gradient font-black">.</span>
                    </h1>
                    <p class="text-[9px] uppercase font-bold tracking-widest text-gray-500 mt-0.5">The Weekend, Curated</p>
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/[0.02] border border-white/[0.05]">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-[11px] font-bold tracking-wide text-gray-300 uppercase">ZM</span>
                </div>
            </div>

            <!-- Search Console Input -->
            <div class="mt-5 relative">
                <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-4 h-4 text-emerald-400/80"></i>
                </div>
                <input type="text" x-model="searchQuery" placeholder="Search artists, venues, or cities..." class="w-full pl-11 pr-4 py-3.5 bg-white/[0.02] border border-white/[0.05] focus:border-emerald-500/20 rounded-2xl text-sm placeholder-gray-600 text-white outline-none transition-all duration-300" />
            </div>

            <!-- Vibe Segment Selector Filters -->
            <div class="mt-4 flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                <template x-for="vibe in ['All', 'Nightlife', 'ChilledVibes', 'Foodie', 'Networking']">
                    <button @click="selectedVibe = vibe" :class="selectedVibe === vibe ? 'bg-white text-black font-bold' : 'bg-white/[0.02] text-gray-400 border-white/[0.04]'" class="px-4 py-2 rounded-xl border text-xs font-medium transition-all duration-300 whitespace-nowrap">
                        <span x-text="vibe === 'All' ? '⚡ All' : vibe === 'ChilledVibes' ? '☕ Chill' : vibe === 'Nightlife' ? '🕺 Party' : vibe === 'Foodie' ? '🍹 Food' : '👔 Mixers'"></span>
                    </button>
                </template>
            </div>
        </div>

        <!-- DYNAMIC APP TIMELINE VIEWPORT -->
        <div class="px-6 flex-grow pb-28 overflow-y-auto no-scrollbar">
            <div class="mt-6">
                
                <!-- WEEKEND TRACK TAB CONTROLLER -->
                <div x-show="activeTab === 'weekend'" class="space-y-4">
                    <h2 class="text-xs uppercase font-extrabold tracking-widest text-gray-400 flex items-center gap-2">Featured Highlights <span class="w-1 h-1 rounded-full bg-emerald-400"></span></h2>

                    <div class="flex gap-4 overflow-x-auto snap-x snap-mandatory no-scrollbar pb-4 w-full">
                        <template x-for="event in filteredEvents.filter(e => String(e.type).toLowerCase() === 'weekend')" :key="event.id">
                            <div class="w-[82vw] max-w-[290px] shrink-0 snap-start relative">
                                <div class="relative h-[440px] rounded-[32px] overflow-hidden border border-white/[0.06] shadow-2xl bg-zinc-900 flex flex-col justify-between p-4">
                                    <img :src="event.image" class="absolute inset-0 w-full h-full object-cover" alt="Flyer" @error="$el.src='https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&q=80&w=800'">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                                    
                                    <!-- Context Card Header Actions -->
                                    <div class="relative z-10 flex justify-between items-center w-full">
                                        <template x-if="event.vibe_status">
                                            <button @click="openVibeCheck(event)" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur-md border border-white/10 text-[9px] font-bold text-emerald-400 tracking-wider uppercase">
                                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping mr-0.5"></span> Live Vibe
                                            </button>
                                        </template>
                                        <template x-if="!event.vibe_status">
                                            <span class="px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur-md text-[9px] font-bold tracking-wider text-white border border-white/10 uppercase" x-text="event.tag || 'CURATED'"></span>
                                        </template>
                                        
                                        <!-- WhatsApp Premium Clean Share Trigger -->
                                        <button @click="shareEvent(event)" class="p-2 rounded-xl bg-black/40 backdrop-blur-md border border-white/10 text-emerald-400 hover:bg-white/10 transition-transform active:scale-95">
                                            <i data-lucide="send" class="w-4 h-4"></i>
                                        </button>
                                    </div>

                                    <!-- Bottom Info Block Overlay Card -->
                                    <div class="relative z-10 w-full rounded-2xl glass-card p-4 space-y-3">
                                        <div>
                                            <span class="text-[10px] font-bold tracking-widest text-emerald-400 uppercase block" x-text="(event.date || '') + ' • ' + (event.time || '')"></span>
                                            <h3 class="text-sm font-bold text-white tracking-tight leading-snug mt-0.5" x-text="event.title"></h3>
                                        </div>
                                        
                                        <div class="space-y-1 text-xs text-gray-400 border-t border-white/[0.05] pt-2">
                                            <p class="flex items-center gap-2 truncate"><i data-lucide="mic" class="w-3.5 h-3.5 text-gray-500"></i><span class="font-medium text-gray-300" x-text="event.artist || 'Various'"></span></p>
                                            <p class="flex items-center gap-2 truncate"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-gray-500"></i><span x-text="(event.venue || '') + ', ' + (event.city || '')"></span></p>
                                        </div>

                                        <button @click="processStepOut(event)" :class="steppedOutEvents.includes(event.id) ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30 font-bold' : 'bg-white text-black font-bold'" class="w-full py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition-all border duration-300 active:scale-95">
                                            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                                            <span x-text="steppedOutEvents.includes(event.id) ? 'Locked In ✓' : 'I\'m Stepping Out'"></span>
                                            <span class="px-1.5 py-0.5 rounded-md text-[10px] bg-black/10 text-current font-bold" x-text="event.attending_count || '0'"></span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- WEEKDAY TRACK LIST VIEW Tab CONTROLLER -->
                <div x-show="activeTab === 'weekday'" class="space-y-3">
                    <h2 class="text-xs uppercase font-extrabold tracking-widest text-gray-400">Mid-Week Sessions</h2>
                    <div class="grid grid-cols-1 gap-3">
                        <template x-for="event in filteredEvents.filter(e => String(e.type).toLowerCase() === 'weekday')" :key="event.id">
                            <div class="glass-panel rounded-2xl p-3.5 flex gap-4 border border-white/[0.03]">
                                <img :src="event.image" class="w-16 h-16 rounded-xl object-cover shrink-0 border border-white/10 my-auto" @error="$el.src='https://images.unsplash.com/photo-1510915228340-29c85a43dcfe?auto=format&fit=crop&q=80&w=800'">
                                <div class="min-w-0 flex-grow flex flex-col justify-between space-y-2">
                                    <div class="flex justify-between items-start gap-2">
                                        <div class="min-w-0">
                                            <h3 class="text-sm font-bold text-white truncate" x-text="event.title"></h3>
                                            <p class="text-xs text-gray-400 truncate" x-text="(event.artist || 'Various') + ' // ' + (event.venue || '')"></p>
                                        </div>
                                        <div class="flex gap-1 shrink-0">
                                            <button @click="shareEvent(event)" class="p-1.5 rounded-lg bg-white/[0.03] border border-white/[0.05] text-emerald-400 hover:bg-white/10 transition-transform active:scale-95">
                                                <i data-lucide="send" class="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="flex justify-between items-center text-[11px] border-t border-white/[0.03] pt-1.5">
                                        <span class="text-emerald-400 font-semibold uppercase tracking-wider text-[10px]" x-text="(event.city || '') + ' • ' + (event.date || '')"></span>
                                        <button @click="processStepOut(event)" class="text-gray-400 hover:text-white flex items-center gap-1 font-bold text-[10px]">
                                            <i data-lucide="sparkles" class="w-3 h-3 text-emerald-400"></i>
                                            <span x-text="event.attending_count || '0'"></span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- EMPTY FALLBACK COMPONENT -->
            <div x-show="filteredEvents.length === 0" class="w-full text-center py-24 space-y-1">
                <i data-lucide="help-circle" class="w-5 h-5 text-gray-600 mx-auto"></i>
                <p class="text-sm text-gray-400 font-medium">No active tracks found.</p>
                <p class="text-xs text-gray-600">Try structural keyword combinations or clear filters.</p>
            </div>
        </div>

        <!-- LIVE VIBE CHECK OVERLAY PANEL -->
        <div x-show="vibeModalOpen" class="fixed inset-0 z-50 flex items-end justify-center px-4 pb-6 bg-black/80 backdrop-blur-sm" style="display: none;" x-transition>
            <div @click.away="vibeModalOpen = false" class="w-full max-w-sm glass-panel rounded-[32px] p-6 border border-white/10 space-y-5 text-center shadow-2xl premium-glow">
                <div class="w-12 h-1.5 bg-white/10 rounded-full mx-auto mb-2"></div>
                
                <div class="space-y-1">
                    <span class="text-[10px] uppercase font-bold tracking-widest text-emerald-400 block">Verified Crowd Status</span>
                    <h4 class="text-lg font-bold text-white" x-text="activeVibeTarget.venue"></h4>
                </div>

                <div class="p-5 rounded-2xl bg-white/[0.02] border border-white/[0.04] inline-flex flex-col items-center justify-center w-full space-y-2">
                    <div class="flex items-center gap-3">
                        <span class="w-3 h-3 rounded-full animate-pulse" :class="String(activeVibeTarget.vibe_status).includes('Packed') ? 'bg-emerald-400' : 'bg-amber-400'"></span>
                        <span class="text-xl font-extrabold text-white tracking-tight" x-text="activeVibeTarget.vibe_status"></span>
                    </div>
                    <p class="text-[11px] text-gray-500">Last updated by venue team at <span class="font-bold text-gray-400" x-text="activeVibeTarget.vibe_updated"></span> today</p>
                </div>

                <button @click="vibeModalOpen = false" class="w-full py-3 bg-white text-black text-xs font-bold rounded-xl tracking-wide">Back to Curation</button>
            </div>
        </div>

        <!-- PREMIUM CORPORATE FOOTER -->
        <footer class="mt-auto px-6 py-6 border-t border-white/[0.03] bg-[#050505]/80 text-center space-y-2 relative z-30">
            <div class="flex items-center justify-center gap-1.5 opacity-40">
                <span class="text-[9px] font-bold uppercase tracking-widest text-gray-400">Engineered by</span>
                <span class="text-xs font-black tracking-tight text-white">vyeta<span class="text-emerald-400">.</span></span>
            </div>
            <div class="text-[8px] font-bold uppercase tracking-widest text-gray-700">© 2026 Vyeta Digital Solutions. All Rights Reserved.</div>
        </footer>

        <!-- NAVIGATION CONSOLE DOCK PILL -->
        <nav class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black via-black/95 to-transparent z-40 flex justify-center pointer-events-none">
            <div class="glass-panel w-full max-w-sm rounded-2xl px-6 py-3.5 flex justify-around items-center border border-white/[0.07] shadow-2xl premium-glow pointer-events-auto">
                <button @click="activeTab = 'weekend'" class="flex flex-col items-center gap-1 transition-all group" :class="activeTab === 'weekend' ? 'text-emerald-400' : 'text-gray-500'">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    <span class="text-[10px] font-bold uppercase tracking-wider">The Weekend</span>
                </button>
                <div class="w-px h-5 bg-white/[0.06]"></div>
                <button @click="activeTab = 'weekday'" class="flex flex-col items-center gap-1 transition-all group" :class="activeTab === 'weekday' ? 'text-emerald-400' : 'text-gray-500'">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span class="text-[10px] font-bold uppercase tracking-wider">Weekdays</span>
                </button>
            </div>
        </nav>

    </main>

    <!-- LUCIDE COMPONENT DYNAMIC RENDERER -->
    <script>
        function renderIcons() { if (window.lucide) { window.lucide.createIcons(); } }
        document.addEventListener('alpine:initialized', () => { setTimeout(renderIcons, 150); });
        window.addEventListener('load', () => { setTimeout(renderIcons, 400); });
        const observer = new MutationObserver(() => { setTimeout(renderIcons, 50); });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>
</body>
</html>
