<!DOCTYPE html>
<html lang="en" class="bg-[#030303] text-gray-100 antialiased selection:bg-emerald-500/30">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsHappenin // Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-sticky {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .glass-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(0, 0, 0, 0.9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .text-gradient {
            background: linear-gradient(135deg, #34d399 0%, #059669 100%);
            -webkit-bg-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex justify-center items-start min-h-screen relative overflow-x-hidden bg-[#030303]">

    <main 
        x-data="{ 
            searchQuery: '',
            selectedVibe: 'All',
            isLoading: true,
            events: [],

            init() {
                const apiURL = 'https://script.google.com/macros/s/AKfycbziBiOAPM6HDx7QZhJDuOQpu6FG4ZjbiWaj2AA-V5efsq_sgWPK41rPVCvjVdSnHE8X2g/exec';
                
                fetch(apiURL)
                    .then(res => res.json())
                    .then(data => { 
                        // Directly attach incoming database rows safely
                        this.events = Array.isArray(data) ? data : []; 
                        this.isLoading = false; 
                    })
                    .catch(err => { 
                        console.error('Data pipeline connection failed:', err); 
                        this.isLoading = false; 
                    });
            },
            get filteredEvents() {
                return this.events.filter(e => {
                    const query = this.searchQuery.toLowerCase().trim();
                    const matchesSearch = !query || 
                        String(e.title || '').toLowerCase().includes(query) || 
                        String(e.artist || '').toLowerCase().includes(query) || 
                        String(e.venue || '').toLowerCase().includes(query) || 
                        String(e.city || '').toLowerCase().includes(query);
                    
                    const matchesVibe = this.selectedVibe === 'All' || 
                        String(e.vibe || '').toLowerCase() === this.selectedVibe.toLowerCase();
                    
                    return matchesSearch && matchesVibe;
                });
            }
        }"
        class="w-full max-w-md min-h-screen bg-[#070707]/90 shadow-2xl relative border-x border-white/[0.03] flex flex-col justify-between"
    >
        
        <div class="px-6 pt-7 pb-4 sticky top-0 z-50 glass-sticky">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-white">
                        WhatsHappenin<span class="text-gradient font-black">.</span>
                    </h1>
                    <p class="text-[9px] uppercase font-bold tracking-widest text-gray-500 mt-0.5">The Weekend, Curated</p>
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/[0.02] border border-white/[0.05]">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-[11px] font-bold tracking-wide text-gray-300 uppercase">ZM</span>
                </div>
            </div>

            <div class="mt-5 relative">
                <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-4 h-4 text-emerald-400/80"></i>
                </div>
                <input 
                    type="text" 
                    x-model="searchQuery"
                    placeholder="Search artists, venues, or cities..." 
                    class="w-full pl-11 pr-4 py-3.5 bg-white/[0.02] border border-white/[0.05] focus:border-emerald-500/30 rounded-2xl text-sm text-white outline-none transition-all duration-300"
                />
            </div>

            <div class="mt-4 flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                <template x-for="vibe in ['All', 'Nightlife', 'ChilledVibes', 'Foodie', 'Networking']">
                    <button 
                        @click="selectedVibe = vibe"
                        :class="selectedVibe === vibe ? 'bg-white text-black font-bold' : 'bg-white/[0.02] text-gray-400 border-white/[0.04]'"
                        class="px-4 py-2 rounded-xl border text-xs font-medium transition-all duration-300"
                    >
                        <span x-text="vibe === 'All' ? '⚡ All' : vibe === 'ChilledVibes' ? '☕ Chill' : vibe === 'Nightlife' ? '🕺 Party' : vibe === 'Foodie' ? '🍹 Food' : '👔 Mixers'"></span>
                    </button>
                </template>
            </div>
        </div>

        <div class="px-6 flex-grow pb-24 overflow-y-auto no-scrollbar">
            
            <div x-show="isLoading" class="w-full flex flex-col items-center justify-center py-32 space-y-3">
                <div class="w-5 h-5 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-[11px] text-gray-600 font-semibold tracking-wider uppercase">Syncing Database Matrix...</p>
            </div>

            <div x-show="!isLoading" class="mt-6 space-y-6">
                <template x-for="event in filteredEvents" :key="event.id">
                    <div class="relative h-[400px] rounded-[28px] overflow-hidden border border-white/[0.06] shadow-2xl bg-zinc-900">
                        <img :src="event.image" class="absolute inset-0 w-full h-full object-cover" alt="Event Flyer" @error="$el.src='https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&q=80&w=800'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                        
                        <div class="absolute top-4 left-4">
                            <span class="px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur-md text-[9px] font-bold tracking-wider text-white border border-white/10 uppercase" x-text="event.tag || 'LIVE'"></span>
                        </div>

                        <div class="absolute bottom-4 left-4 right-4 p-4 rounded-2xl glass-card space-y-1.5">
                            <span class="text-[10px] font-bold tracking-widest text-emerald-400 uppercase block" x-text="(event.date || '') + ' • ' + (event.time || '')"></span>
                            <h3 class="text-base font-bold text-white tracking-tight leading-snug" x-text="event.title"></h3>
                            
                            <div class="space-y-1 pt-2 text-xs text-gray-400 border-t border-white/[0.05]">
                                <p class="flex items-center gap-2 truncate"><i data-lucide="mic" class="w-3.5 h-3.5 text-gray-500"></i><span class="font-medium text-gray-300" x-text="event.artist || 'Various Artists'"></span></p>
                                <p class="flex items-center gap-2 truncate"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-gray-500"></i><span x-text="(event.venue || '') + ', ' + (event.city || '')"></span></p>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="!isLoading && filteredEvents.length === 0" class="w-full text-center py-24 space-y-1">
                <i data-lucide="help-circle" class="w-5 h-5 text-gray-600 mx-auto"></i>
                <p class="text-sm text-gray-400 font-medium">No curation matches your query.</p>
                <p class="text-xs text-gray-600">Try clearing your filters or changing search keywords.</p>
            </div>
        </div>

        <footer class="mt-auto px-6 py-8 border-t border-white/[0.03] bg-[#050505]/60 text-center space-y-2">
            <div class="flex items-center justify-center gap-1.5 opacity-40">
                <span class="text-[9px] font-bold uppercase tracking-widest text-gray-400">Engineered by</span>
                <span class="text-xs font-black tracking-tight text-white">vyeta<span class="text-emerald-400">.</span></span>
            </div>
            <div class="text-[8px] font-bold uppercase tracking-widest text-gray-700">
                © 2026 Vyeta Digital Solutions. All Rights Reserved.
            </div>
        </footer>

    </main>

    <script>
        document.addEventListener('alpine:initialized', () => {
            setTimeout(() => { lucide.createIcons(); }, 150);
        });
        window.addEventListener('load', () => {
            setTimeout(() => { lucide.createIcons(); }, 400);
        });
    </script>
</body>
</html>
